name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Project
        working-directory: mobile_app
        run: flutter analyze

      - name: Build Android Release APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Build Android Debug APK
        working-directory: mobile_app
        run: flutter build apk --debug

      - name: Upload CyberShield Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberShield-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload CyberShield Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberShield-Debug-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
